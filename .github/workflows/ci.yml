name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
  player:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: player
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        # the tvOS triples are for the app's xcframework, below
        with:
          targets: aarch64-apple-tvos, aarch64-apple-tvos-sim
      # the player tests link the core's stream ABI
      - run: cargo build --locked
        working-directory: core
      # FFmpeg takes far longer to build than the tests take to run, and only
      # the build script decides what comes out of it.
      - uses: actions/cache@v4
        with:
          path: |
            player/Vendor
            player/.build-ffmpeg
            player/.build-dav1d
            player/.build-libass
            player/Sources/CFFmpeg/include/libav*
            player/Sources/CFFmpeg/include/libsw*
            player/Sources/CLibass/include/ass
          key: vendor-${{ runner.os }}-${{ hashFiles('player/scripts/build-ffmpeg.sh', 'player/scripts/build-libass.sh') }}
      # dav1d and HarfBuzz build with meson
      - run: brew install meson ninja
      - run: bash scripts/build-ffmpeg.sh
      - run: bash scripts/build-libass.sh
      - run: swift test
      # `swift test` runs on macOS: it never crosses the tvOS SDK, so an
      # API_UNAVAILABLE(tvos) symbol (preferredDynamicRange's predecessor,
      # once) compiles clean here and only breaks on the platform the app
      # ships for. This is the actual tvOS build, not a syntax check.
      # The native build system: SwiftPM's newer one links for the host
      # whatever -target says. The target is the package's own tvOS 27.
      - name: build the player package for the tvOS simulator
        run: |
          SDK=$(xcrun --sdk appletvsimulator --show-sdk-path)
          swift build --build-system native --scratch-path .build-tvos \
            -Xswiftc -target -Xswiftc arm64-apple-tvos27.0-simulator -Xswiftc -sdk -Xswiftc "$SDK" \
            -Xcc -target -Xcc arm64-apple-tvos27.0-simulator -Xcc -isysroot -Xcc "$SDK"
      # A margin written as a number is a screen that answers to nobody: the
      # rhythm lives in Theme.Space, and this is what keeps it there.
      - run: bash tv/scripts/check-spacing.sh
        working-directory: ${{ github.workspace }}
      # The tvOS app: the core for the simulator, the bindings, the xcodegen
      # project, and a build for one concrete arm64 simulator (the core's
      # slice is arm64 only, so never `generic`).
      - run: brew install xcodegen
      - run: bash tv/scripts/build-core.sh
        working-directory: ${{ github.workspace }}
      - name: build the app for the tvOS simulator
        working-directory: tv
        run: |
          xcodegen generate --quiet
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["runtimes"]
          tvos = [r["identifier"] for r in runtimes if r["identifier"].startswith(
              "com.apple.CoreSimulator.SimRuntime.tvOS")]
          print(tvos[-1])')
          DEVICE=$(xcrun simctl create ci-lexis-tv \
            com.apple.CoreSimulator.SimDeviceType.Apple-TV-4K-3rd-generation-4K "$RUNTIME")
          xcodebuild test -project Lexis.xcodeproj -scheme Lexis \
            -destination "id=$DEVICE" CODE_SIGNING_ALLOWED=NO
